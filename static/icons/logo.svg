<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143a66"/>
      <stop offset="1" stop-color="#071a33"/>
    </linearGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="94" y1="213" x2="375" y2="137">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- background, works as a full-bleed iPhone icon too -->
  <rect width="512" height="512" rx="112" fill="url(#sea)"/>
  <!-- swing circle -->
  <circle cx="256" cy="256" r="168" fill="#3fc1e8" fill-opacity="0.08" stroke="#3fc1e8" stroke-width="12"
          stroke-dasharray="30 22" stroke-linecap="round"/>
  <!-- the boat's track, fading into the past -->
  <path d="M93.7 212.5 A168 168 0 0 1 374.8 137.2" fill="none" stroke="url(#trail)" stroke-width="12" stroke-linecap="round"/>
  <!-- the boat on the circle, bow pointing at the anchor -->
  <g transform="translate(374.8 137.2) rotate(225)">
    <path d="M0 -40 C18 -22 18 8 13 30 H-13 C-18 8 -18 -22 0 -40 Z" fill="#ffb547" stroke="#071a33" stroke-width="6"/>
  </g>
  <!-- anchor -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="160" r="22"/>
    <path d="M256 182 V350"/>
    <path d="M214 216 H298"/>
    <path d="M178 290 C186 336 218 354 256 354 C294 354 326 336 334 290"/>
  </g>
  <path d="M164 300 L178 272 L196 300 Z M348 300 L334 272 L316 300 Z" fill="#ffffff"/>
</svg>
