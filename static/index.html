<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orca Core Live</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--muted:#66707c;--line:#e3e6ea;--accent:#0a6cbd;--ok:#1f8a4c;--warn:#b26a00;--bad:#c0392b;--core:#eef5fc}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--panel:#1a1e24;--text:#e6e9ed;--muted:#8d97a3;--line:#2a3038;--accent:#5aa9f0;--ok:#4cc27e;--warn:#e0a03a;--bad:#ef6a5b;--core:#1b2836}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
h1{font-size:17px;margin:0}
h2{font-size:15px;margin:22px 0 8px}
main{padding:0 16px 32px;max-width:1300px;margin:0 auto}
.status{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--bad)}
.dot.on{background:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .l{color:var(--muted);font-size:12px}
.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v.small{font-size:14px;font-weight:500;line-height:1.5}
.tile .u{font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
.tools{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);min-width:240px}
label{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--bg);font-weight:600;color:var(--accent)}
tr.core td{background:var(--core)}
.age{color:var(--muted)}.age.warn{color:var(--warn)}.age.old{color:var(--bad)}
.raw{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:12px}
.err{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Orca Core Live</h1>
  <div class="status" id="status">Connecting…</div>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="tools">
    <input type="search" id="filter" placeholder="Filter (e.g. wind, depth, 254)">
    <label><input type="checkbox" id="coreOnly"> Only Orca Core values (source 254)</label>
    <label><input type="checkbox" id="showRaw"> Show raw SI values</label>
  </div>
  <h2>All values</h2>
  <div class="scroll"><table id="values"></table></div>
  <h2>AIS targets <span id="aisCount" class="age"></span></h2>
  <div class="scroll"><table id="ais"></table></div>
  <h2>NMEA 2000 devices</h2>
  <div class="scroll"><table id="devices"></table></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state=null;
try{$('coreOnly').checked=localStorage.getItem('coreOnly')==='1';$('showRaw').checked=localStorage.getItem('showRaw')==='1';$('filter').value=localStorage.getItem('filter')||''}catch(e){}
for(const id of ['coreOnly','showRaw','filter'])$(id).addEventListener('input',()=>{try{localStorage.setItem('coreOnly',$('coreOnly').checked?'1':'0');localStorage.setItem('showRaw',$('showRaw').checked?'1':'0');localStorage.setItem('filter',$('filter').value)}catch(e){}render()});

function ageClass(a){return a>60?'age old':a>10?'age warn':'age'}
function fmtAge(a){return a>=1e8?'–':a<60?a.toFixed(1)+' s':a<3600?Math.round(a/60)+' min':(a/3600).toFixed(1)+' h'}
// prefer the Orca Core's own value (254), otherwise the freshest source
function pick(group,fieldTest){
  const c=state.rows.filter(r=>r.group===group&&fieldTest(r.field));
  return c.find(r=>r.source==='254')||c.sort((a,b)=>a.age_s-b.age_s)[0];
}
const is=f=>x=>x===f, inst=(i,f)=>x=>x.startsWith(i+'.'+f);
function tile(label,r,small){
  if(!r)return `<div class="tile"><div class="l">${esc(label)}</div><div class="v">–</div></div>`;
  return `<div class="tile" title="${esc(r.key)} · ${esc(r.source_label)}"><div class="l">${esc(label)}</div><div class="v${small?' small':''}">${esc(r.text)}<span class="u">${esc(r.unit)}</span></div><div class="${ageClass(r.age_s)}" style="font-size:11px">${fmtAge(r.age_s)} · ${esc(r.source_label||r.source)}</div></div>`;
}
function render(){
  if(!state)return;
  const st=state.status, now=state.time;
  $('status').innerHTML=Object.entries(st).map(([k,s])=>`<span><span class="dot ${s.connected?'on':''}"></span>${k}: ${s.connected?'connected':'disconnected'} · ${s.messages} msgs${s.last_message?' · last '+fmtAge(now-s.last_message):''}${s.last_error&&!s.connected?' · <span class="err">'+esc(s.last_error)+'</span>':''}</span>`).join('')+(state.devices_error?`<span class="err">devices: ${esc(state.devices_error)}</span>`:'');
  const lat=pick('navigation.position',is('latitude')), lon=pick('navigation.position',is('longitude'));
  $('tiles').innerHTML=[
    lat&&lon?`<div class="tile" title="${esc(lat.key)}"><div class="l">Position</div><div class="v small">${esc(lat.text)}<br>${esc(lon.text)}</div><div class="${ageClass(lat.age_s)}" style="font-size:11px">${fmtAge(lat.age_s)} · ${esc(lat.source_label)}</div></div>`:tile('Position',null),
    tile('SOG',pick('navigation.cogsog',is('speed'))), tile('COG',pick('navigation.cogsog',is('course'))),
    tile('Heading',pick('navigation.heading',is('heading'))), tile('Depth',pick('environment.depth',is('belowTransducer'))),
    tile('Speed through water',pick('environment.waterSpeed',is('speed'))),
    tile('Apparent wind speed',pick('environment.wind',inst(2,'speed'))), tile('Apparent wind angle',pick('environment.wind',inst(2,'angle'))),
    tile('True wind speed',pick('environment.wind',inst(0,'speed'))), tile('True wind direction',pick('environment.wind',inst(0,'angle'))),
    tile('Heel (roll)',pick('environment.attitude',is('roll'))), tile('Rudder',pick('steering.rudder',f=>f.endsWith('position'))),
    tile('Core supply',pick('battery',f=>f.endsWith('voltage'))), tile('Satellites',pick('navigation.gnss',is('satellites'))),
  ].join('');
  const q=$('filter').value.trim().toLowerCase(), coreOnly=$('coreOnly').checked, raw=$('showRaw').checked;
  let rows=state.rows.filter(r=>(!coreOnly||r.source==='254')&&(!q||(r.key+' '+r.source_label+' '+r.text).toLowerCase().includes(q)));
  let html=`<tr><th>Field</th><th>Source</th><th class="num">Value</th><th>Unit</th>${raw?'<th>Raw (SI)</th>':''}<th>Age</th></tr>`, g=null;
  for(const r of rows){
    if(r.group!==g){g=r.group;html+=`<tr class="grp"><td colspan="${raw?6:5}">${esc(g)}</td></tr>`}
    html+=`<tr class="${r.source==='254'?'core':''}" title="${esc(r.key)}"><td>${esc(r.field)}</td><td>${esc(r.source)} · ${esc(r.source_label)}</td><td class="num">${esc(r.text)}</td><td>${esc(r.unit)}</td>${raw?`<td class="raw">${esc(r.raw)}</td>`:''}<td class="${ageClass(r.age_s)}">${fmtAge(r.age_s)}</td></tr>`;
  }
  $('values').innerHTML=rows.length?html:'<tr><td>No values yet.</td></tr>';
  const a=state.ais; $('aisCount').textContent=`(${a.length})`;
  $('ais').innerHTML=a.length?`<tr><th>Name</th><th>MMSI</th><th>Call sign</th><th class="num">Range NM</th><th class="num">Bearing °</th><th class="num">SOG kn</th><th class="num">COG °</th><th class="num">Heading °</th><th>Class</th><th>Type</th><th class="num">Length m</th><th>Destination</th><th>Age</th></tr>`+
    a.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.mmsi)}</td><td>${esc(t.callsign)}</td><td class="num">${esc(t.range_nm)}</td><td class="num">${esc(t.bearing)}</td><td class="num">${esc(t.SOG)}</td><td class="num">${esc(t.COG)}</td><td class="num">${esc(t.headingTrue)}</td><td>${esc(t.class)}</td><td>${esc(t.vesselType)}</td><td class="num">${esc(t.length)}</td><td>${esc(t.destination)}</td><td class="${ageClass(t.age_s)}">${fmtAge(t.age_s)}</td></tr>`).join(''):'<tr><td>No AIS targets.</td></tr>';
  $('devices').innerHTML=`<tr><th class="num">Source</th><th>Manufacturer</th><th>Model</th><th>Serial</th><th>Function</th></tr>`+
    state.devices.map(d=>`<tr><td class="num">${esc(d.source)}</td><td>${esc(d.manufacturer)}</td><td>${esc(d.model)}</td><td>${esc(d.serial)}</td><td>${esc(d.description)}</td></tr>`).join('');
}
async function poll(){
  try{const r=await fetch('/api/state',{cache:'no-store'});state=await r.json();render()}
  catch(e){$('status').innerHTML='<span class="err">Reader not running</span>'}
  setTimeout(poll,1000);
}
poll();
</script>
</body>
</html>
